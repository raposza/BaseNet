#
# The defaults, sourced by every script here. Do not edit this file: put your
# own values in basenet.conf.local - same syntax, any subset of these keys.
# Every script sources that one after this one and it is never committed, so
# a real address or password never reaches a shared copy of this tree.

# The Splice release. Founded at 0.7.4; 0.7.5 renders unchanged. For any
# other release, run render.sh first and read what it rejects.
STR_SPLICE_VERSION=0.7.4

# The Helm registry the charts are pulled from at install time. Nothing from
# it is redistributed in this repository.
STR_CHART_REPO=oci://ghcr.io/digital-asset/decentralized-canton-sync/helm

# The Kubernetes namespace the whole stack lives in. teardown.sh deletes it.
STR_NAMESPACE=sv

# The OIDC provider the SV and validator apps validate their tokens against,
# as reachable FROM INSIDE THE CLUSTER. A host address, not localhost: inside
# a pod, localhost is that pod.
STR_OIDC_BASE_URL=http://oidc.example.internal:32002

# THE IDENTITY PROVIDER IS REPLACEABLE. jwtmint.sh starts the bundled one;
# any OIDC provider the cluster can reach serves instead. These three are all
# the charts take from it - see docs/auth.md.
#
# Where the sv and validator apps fetch the signing keys. Blank means the
# bundled provider's path under STR_OIDC_BASE_URL. For any other provider, the
# jwks_uri its /.well-known/openid-configuration publishes.
STR_OIDC_JWKS_URL=
# The aud claim the sv and validator apps require on every inbound token.
STR_OIDC_AUDIENCE=https://sv.example.com
# The client the SV web UI logs in as. Register it at your provider.
STR_OIDC_SV_UI_CLIENT_ID=sv-ui

# Who can sign in at the bundled provider's login page: name:password pairs,
# comma separated. A test system's users, in plain text on purpose; each name
# is the sub of every token that person gets. A replacement provider keeps its
# own users and ignores this.
STR_JWTMINT_USERS=sv-user:123456,memberorg-a-user:123456,memberorg-b-user:123456

# The registry the CONTAINER IMAGES come from. Blank uses the vendor's, which
# is what the charts default to. Set it to your own mirror - Artifactory,
# Harbor, anything that speaks the registry API - and every image reference is
# rewritten to it. ./images.sh prints the list to mirror.
STR_IMAGE_REPO=

# WHEN THE MIRROR DOES NOT KEEP THE VENDOR'S NAMES. STR_IMAGE_REPO is one
# prefix for every image; each chart appends its own name to it. A registry
# that holds an image somewhere else, or under another name, needs a per-image
# override instead. Whitespace-separated <release>:<chart key>=<value>; see
# shared/image-overrides.sh for the rules and docs/images.md for every key the
# charts publish.
STR_IMAGE_OVERRIDE=

# PostgreSQL is the exception: splice-postgres renders imageName as the WHOLE
# reference and its imageRepo does not reach it, so this carries the registry
# too when STR_IMAGE_REPO is set. It is the chart's own default value; check it
# against `helm show values` after a version bump.
STR_PG_IMAGE=postgres:14

# What the UIs call this network.
STR_NETWORK_NAME=BaseNet

# The PostgreSQL password for the four throwaway databases. This is a
# disposable environment; the password is written into the pod spec by the
# global-domain chart and is not a secret worth protecting here.
STR_PG_PASSWORD=supersafe

# The storage class for every PVC. k3s ships local-path.
STR_STORAGE_CLASS=local-path

# ---- The MemberOrg side -----------------------------------------------------
#
# memberorg-secrets.sh, memberorg-install.sh and memberorg-teardown.sh stand up
# a MemberOrg's validator node - PostgreSQL, a participant, and a validator
# with the wallet and name-service UIs - the way an organization deploys one
# against DevNet, TestNet or MainNet, pointed at the BaseNet Validator instead. One per
# name, each in its own namespace.
#
# The addresses a MemberOrg is given by the network it joins: its scan, its
# sponsoring SV and its sequencer. Blank means this BaseNet Validator, reached from
# another namespace on the same cluster. A MemberOrg on another cluster sets
# addresses that cluster can reach.
STR_EXT_SCAN_URL=
STR_EXT_SPONSOR_URL=
STR_EXT_SEQUENCER_URL=

# ---- A MemberOrg's identity -----------------------------------------------
#
# A MemberOrg authenticates the way an organization does against DevNet,
# TestNet or MainNet: its participant verifies RS256 tokens against the
# provider's JWKS, its validator gets its own token from the provider with
# client_credentials, and its wallet and name-service UIs sign a person in
# with the authorization code flow. Pointing MemberOrgs at Keycloak is
# changing these and the STR_OIDC_* keys above - nothing else.
#
# %s in a value is the MemberOrg's name. Any STR_MO_* key is overridden for one
# MemberOrg by the same key with the name appended in capitals, dashes as
# underscores - STR_MO_WALLET_USER_MEMBERORG_A=<a Keycloak user's sub>.
#
# Where the validator finds the token endpoint: the provider's discovery
# document. Blank means STR_OIDC_BASE_URL/.well-known/openid-configuration.
STR_OIDC_WELL_KNOWN_URL=
# The machine client the validator authenticates as, and its secret. The
# bundled provider does not check the secret; Keycloak does.
STR_MO_CLIENT_ID=%s-validator
STR_MO_CLIENT_SECRET=%s-secret
# The ledger user the validator's tokens speak for - the sub the provider puts
# in them, and the participant's administrator. The bundled provider's sub is
# the client id; Keycloak's is the service account's id, so set this to it.
STR_MO_LEDGER_USER=%s-validator
# The audience the participant requires on those tokens.
STR_MO_LEDGER_AUDIENCE=https://ledger_api.example.com
# The person who owns the MemberOrg's wallet: the sub of their token. Each
# MemberOrg has its own. The bundled provider's users are STR_JWTMINT_USERS.
STR_MO_WALLET_USER=%s-user
# The clients the wallet and name-service UIs sign in as.
STR_MO_WALLET_UI_CLIENT_ID=wallet-ui
STR_MO_ANS_UI_CLIENT_ID=ans-ui

# ---- The web UIs ----------------------------------------------------------
#
# ui.py serves the vendor's web UIs on this machine, one port per namespace:
# this one for BaseNet Validator, the next ones for the MemberOrgs in name order.
STR_UI_PORT=4400

#
# The scan app. networkName is overridden by install.sh from basenet.conf.

isFirstSv: true
participantAddress: participant
sequencerAddress: global-domain-0-sequencer
mediatorAddress: global-domain-0-mediator

# Static tokens rather than the client_credentials grant. This is what makes a
# private deployment tractable: no token endpoint has to exist.
cluster:
  fixedTokens: true

persistence:
  databaseName: cantonnet_scan
  schema: scan
  host: apps-pg
  port: 5432
  user: cnadmin
  secretName: postgres-secrets

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    memory: 6Gi

spliceInstanceNames:
  networkName: "BaseNet"
  networkFaviconUrl: "https://www.hyperledger.org/hubfs/hyperledgerfavicon.png"
  amuletName: "Amulet"
  amuletNameAcronym: "AMT"
  nameServiceName: "Amulet Name Service"
  nameServiceNameAcronym: "ANS"

enableReloader: false

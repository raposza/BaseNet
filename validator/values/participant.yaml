#
# The Canton participant. disableAuth is a real key on this chart, documented
# in its own values as highly insecure - see docs/auth.md for what it actually
# switches on, which is not "no authentication".

disableAuth: true
enableReloader: false

resources:
  requests:
    cpu: "1"
    memory: 6Gi
  limits:
    memory: 16Gi

persistence:
  host: participant-pg
  port: 5432
  databaseName: cantonnet_participant
  schema: participant
  secretName: postgres-secrets

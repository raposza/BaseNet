#
# The sequencer and mediator. This chart takes no auth configuration at all -
# only persistence.

enableAntiAffinity: false
enableReloader: false

sequencer:
  # CANTONBFT, ONE NODE AND NO PEERS - D-858. From Splice 0.8.0 the chart has
  # NO postgres (reference) driver: templates/sequencer.yaml at 0.8.0 to 0.8.3
  # carries cometbft and cantonbft only, and `type: "postgres"` renders a
  # sequencer with NO driver block, which render.sh does not catch. This is
  # the setting BaseNet was founded on at 0.8.3 on 2026-09-25, together with
  # domain.enableBftSequencer in sv.yaml. The 0.7.x charts are not served by
  # these values.
  #
  # REQUIRED, and nothing catches its absence before the render: the template
  # switches on sequencer.driver.type with no nil-guard, the chart's own
  # values.yaml has no driver key, and values.schema.json does not mention it.
  #
  # address and password stay as the network was founded with them; they must
  # be SCALARS, and install.sh supplies the password from basenet.conf.
  driver:
    type: cantonbft
    externalAddress: global-domain-0-sequencer
    externalPort: 5010
    address: sequencer-pg
  persistence:
    host: sequencer-pg
    port: 5432
    databaseName: cantonnet_sequencer
    secretName: postgres-secrets
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 6Gi

mediator:
  persistence:
    host: mediator-pg
    port: 5432
    databaseName: cantonnet_mediator
    secretName: postgres-secrets
  resources:
    requests:
      cpu: "0.5"
      memory: 1Gi
    limits:
      memory: 4Gi
